name: Manual bottom-panel Simulator comparison

# Branch-only proof: main's Release/device canary is unchanged.
on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Optional prior bottom-panel canary run; reuse its preserved app without compilation
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: dapperdan-debug-capture-proof
  cancel-in-progress: false

env:
  BUNDLE_ID: net.codecrafty.dapperdan
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PROJECT_PATH: src/DapperDan/DapperDan.csproj
  WORKLOAD_VERSION: 10.0.302.1

jobs:
  capture:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'LathanHarper/DapperDan' && github.event.repository.private == false && github.ref == 'refs/heads/codex/panelboss-bottom-inset-canary' }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out exact public proof source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Test capture-selection and image contracts
        run: node --test tools/simulator-proof/*.test.mjs

      - name: Validate optional public reuse request
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REUSE_RUN_ID" && ! "$REUSE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo 'reuse_run_id must be an ordinary numeric public proof run ID.' >&2
            exit 1
          fi

      - name: Download retained public app without compilation
        if: ${{ inputs.reuse_run_id != '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dapperdan-debug-reusable-${{ inputs.reuse_run_id }}
          path: artifacts/reuse
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}

      - name: Verify and extract retained Simulator app
        if: ${{ inputs.reuse_run_id != '' }}
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: node tools/simulator-proof/capture.mjs restore

      - name: Install pinned .NET SDK
        if: ${{ inputs.reuse_run_id == '' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Record and verify public toolchain
        if: ${{ inputs.reuse_run_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/recovery artifacts/captures
          test "$(uname -m)" = "arm64"
          test -d "$DEVELOPER_DIR"
          test "$(dotnet --version)" = "10.0.302"
          {
            printf 'source_commit=%s\nrun_id=%s\nconfiguration=Debug\nruntime=iossimulator-arm64\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"
            printf 'bundle_id=%s\n' "$BUNDLE_ID"
            date -u '+started_utc=%Y-%m-%dT%H:%M:%SZ'
            xcodebuild -version
            xcrun --sdk iphonesimulator --show-sdk-version
            dotnet --info
          } | tee artifacts/recovery/toolchain.txt
          xcrun simctl list -j > artifacts/recovery/simulators-before.json

      - name: Restore pinned workloads and packages
        if: ${{ inputs.reuse_run_id == '' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install maui-ios 2>&1 | tee artifacts/recovery/workload-restore.log
          test "$(dotnet workload --version)" = "$WORKLOAD_VERSION"
          node tools/simulator-proof/project-lock.mjs
          dotnet restore "$PROJECT_PATH" --locked-mode \
            -p:TargetFrameworks=net10.0-ios -r iossimulator-arm64 \
            -p:DapperDanBottomPanelCanary=true \
            -p:NuGetLockFilePath="$GITHUB_WORKSPACE/artifacts/recovery/packages.iossimulator.lock.json" \
            2>&1 | tee artifacts/recovery/package-restore.log

      - name: Build one unsigned Debug Simulator app
        if: ${{ inputs.reuse_run_id == '' }}
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          dotnet build "$PROJECT_PATH" \
            -f net10.0-ios -c Debug -r iossimulator-arm64 --no-restore \
            -p:TargetFrameworks=net10.0-ios \
            -p:DapperDanBottomPanelCanary=true \
            -p:ApplicationId="$BUNDLE_ID" \
            -p:EnableCodeSigning=false -p:ArchiveOnBuild=false -p:BuildIpa=false \
            -p:ContinuousIntegrationBuild=true \
            -bl:artifacts/recovery/simulator-debug.binlog \
            2>&1 | tee artifacts/recovery/build.log

      - name: Preserve reusable app before Simulator operations
        id: preserve
        if: ${{ inputs.reuse_run_id == '' }}
        run: node tools/simulator-proof/capture.mjs preserve

      - name: Retain app and public provenance before capture
        if: ${{ steps.preserve.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dapperdan-debug-reusable-${{ github.run_id }}
          path: artifacts/recovery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Re-seal a fresh Simulator copy without signing credentials
        id: repair
        run: node tools/simulator-proof/capture.mjs sign-simulator

      - name: Preserve re-sealed Simulator product before capture
        if: ${{ steps.repair.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dapperdan-adhoc-simulator-${{ github.run_id }}
          path: artifacts/adhoc-recovery/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Capture native iPhone and iPad baseline and safe-area-none sequentially
        timeout-minutes: 12
        run: node tools/simulator-proof/capture.mjs capture

      - name: Retain screenshots and partial logs even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dapperdan-debug-capture-evidence-${{ github.run_id }}
          path: |
            artifacts/captures/
            artifacts/recovery/toolchain.txt
            artifacts/recovery/receipt.json
            artifacts/recovery/*.log
            artifacts/adhoc-recovery/transformation-receipt.json
          if-no-files-found: warn
          retention-days: 1
